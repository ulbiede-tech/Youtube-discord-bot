name: YouTube Discord Bot

on:
  schedule:
    # Alle 5 Minuten, aber NICHT genau bei Minute 00.
    # Dadurch vermeiden wir den besonders stark belasteten
    # Stundenbeginn bei GitHub Actions.
    - cron: "3-59/5 * * * *"

  workflow_dispatch:

concurrency:
  group: youtube-discord-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Bot starten
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: python bot.py

      - name: Zustandsdatei speichern
        run: |
          if [ -n "$(git status --porcelain -- posted_videos.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add posted_videos.json
            git commit -m "Update YouTube bot state"
            git push
          else
            echo "Keine Änderung an der Zustandsdatei."
          fi
